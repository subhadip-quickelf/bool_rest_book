#  Configure application
spring.application.name=boot_rest_book

# Configure server error
server.error.include-stacktrace=never
server.error.include-path=never

# Configure DB connection
spring.datasource.name=boot_rest_book
spring.datasource.url=jdbc:mysql://localhost:3300/boot_rest_book
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
# spring.jpa.properties.hibernate.dialect=MySQL8Dialect